# Neutral tmux look for the party demo: no status bar, no prefix-key hints,
# thin grey borders with each pane's demo folder as its label.
set -g status off
set -g mouse off
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g escape-time 0
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-border-style "fg=#3a3f47"
set -g pane-active-border-style "fg=#3a3f47"
set -g allow-rename off
set -g history-limit 2000
# Ctrl+Q ends the demo: the tmux server and every session in it.
bind -n C-q kill-server
